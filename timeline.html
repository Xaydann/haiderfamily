<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topnav">
  <div class="brand">
    <div class="mark">Family Timeline</div>
    <div class="sub">every recorded moment, in order</div>
  </div>
  <div class="navlinks">
    <a href="index.html">Tree</a>
    <a href="forum.html">Forum</a>
    <a href="timeline.html" class="active">Timeline</a>
    <a href="map.html">Map</a>
  </div>
  <div class="controls">
    <button class="iconbtn search-trigger" type="button" title="Search people (or just start typing)" aria-label="Search people">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="iconbtn theme-toggle" type="button" title="Toggle dark mode"></button>
    <div class="family-switch" id="familySwitch">
      <button class="family-pill" id="familyPillBtn" type="button">
        <span id="familyPillLabel">Family Tree</span>
        <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="family-menu" id="familyMenu"></div>
    </div>
  </div>
</div>

<div class="timeline-wrap" id="timelineWrap">
  <div class="timeline-header" id="timelineHeader">
    <h1>Timeline</h1>
    <p class="hint-sm">Every life event recorded across the tree, oldest to newest. Add events from a person's edit panel.</p>
  </div>
  <div id="timelineList"></div>
  <div class="empty-timeline" id="emptyTimeline" style="display:none;">No events recorded yet.</div>
</div>

<script src="js/auth-shared.js"></script>
<div id="searchHost"></div>
<script src="js/timeline.js"></script>
<script src="js/search.js"></script>
</body>
</html>
